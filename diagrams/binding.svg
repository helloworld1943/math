<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Substitution: replace a reference without changing its binder</title>
  <desc id="description">Three tested cases: replace x with z beneath a lambda binding y; stop beneath the binder for x; reject inserting a reference to the surrounding binder y. Reference links identify declarations, not names.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526078"/></marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 17px; fill: #17243b; }
      .title { font-size: 27px; font-weight: bold; }
      .heading { font-size: 21px; font-weight: bold; }
      .small { font-size: 15px; fill: #465873; }
      .mono { font-family: monospace; font-size: 17px; }
      .panel { fill: white; stroke: #cbd5e1; }
      .node { fill: #e8f1ff; stroke: #4270b5; stroke-width: 1.5; }
      .rule { fill: #f0eaff; stroke: #8261b5; stroke-width: 1.5; }
      .good { fill: #e4f4ee; stroke: #31826a; }
      .bad { fill: #fff0f0; stroke: #bd4756; }
      .edge { fill: none; stroke: #526078; stroke-width: 1.6; marker-end: url(#arrow); }
      .reference { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="1200" height="1060" fill="#f3f6fb"/>
  <text x="35" y="42" class="title">1. Substitution: which declaration does a reference mean?</text>
  <text x="35" y="72" class="small">Solid arrows = structure. Dashed arrows = reference to a binder. Boxes with the same letter name a specific identity.</text>

  <rect x="25" y="95" width="1150" height="355" rx="12" class="panel"/>
  <text x="45" y="130" class="heading">PASS: replace x with z inside lambda y. x</text>
  <text x="45" y="158" class="mono">(lambda x. lambda y. x) z  --reduces to--&gt;  lambda y. z</text>
  <text x="90" y="198" class="small">Original inner expression</text>
  <path d="M190 260 V300" class="edge"/>
  <text x="205" y="286" class="small">body</text>
  <path d="M290 235 H360" class="edge"/>
  <text x="302" y="222" class="small">binder</text>
  <path d="M290 325 H360" class="edge reference"/>
  <rect x="90" y="210" width="200" height="50" rx="8" class="node"/>
  <text x="190" y="242" text-anchor="middle" class="mono">lambda y</text>
  <rect x="90" y="300" width="200" height="50" rx="8" class="node"/>
  <text x="190" y="332" text-anchor="middle" class="mono">reference to x</text>
  <rect x="360" y="210" width="145" height="50" rx="8" class="node"/>
  <text x="432" y="242" text-anchor="middle" class="mono">binder y</text>
  <rect x="360" y="300" width="145" height="50" rx="8" class="node"/>
  <text x="432" y="332" text-anchor="middle" class="mono">binder x</text>
  <text x="635" y="198" class="small">Proposed result</text>
  <path d="M735 260 V300" class="edge"/>
  <text x="750" y="286" class="small">body</text>
  <path d="M835 235 H905" class="edge"/>
  <text x="847" y="222" class="small">binder</text>
  <path d="M835 325 H905" class="edge reference"/>
  <rect x="635" y="210" width="200" height="50" rx="8" class="node"/>
  <text x="735" y="242" text-anchor="middle" class="mono">lambda y</text>
  <rect x="635" y="300" width="200" height="50" rx="8" class="node"/>
  <text x="735" y="332" text-anchor="middle" class="mono">reference to z</text>
  <rect x="905" y="210" width="145" height="50" rx="8" class="node"/>
  <text x="977" y="242" text-anchor="middle" class="mono">binder y</text>
  <rect x="905" y="300" width="145" height="50" rx="8" class="node"/>
  <text x="977" y="332" text-anchor="middle" class="mono">binder z</text>
  <rect x="65" y="375" width="1070" height="48" rx="8" class="good"/>
  <text x="85" y="405">The inner binder stays y. The body now points to z, not to y. The supplied result passes.</text>

  <rect x="25" y="470" width="1150" height="235" rx="12" class="panel"/>
  <text x="45" y="505" class="heading">PASS: stop at the binder being replaced</text>
  <rect x="65" y="530" width="310" height="60" rx="8" class="node"/>
  <text x="220" y="567" text-anchor="middle" class="mono">lambda x. x</text>
  <path d="M375 560 H690" class="edge"/>
  <text x="405" y="545" class="small">substitute z for outside x</text>
  <rect x="690" y="530" width="310" height="60" rx="8" class="node"/>
  <text x="845" y="567" text-anchor="middle" class="mono">lambda x. x</text>
  <text x="65" y="625">The lambda declares x itself. Its body belongs to that binder, so we leave the body alone.</text>
  <text x="65" y="660" class="small">This is a substitution test, not a claim that different declarations with the same spelling are identical.</text>

  <rect x="25" y="725" width="1150" height="255" rx="12" class="panel"/>
  <text x="45" y="760" class="heading">REJECT: insertion would capture the reference</text>
  <rect x="65" y="785" width="300" height="65" rx="8" class="node"/>
  <text x="215" y="825" text-anchor="middle" class="mono">lambda y. x</text>
  <path d="M365 817 H670" class="edge"/>
  <text x="390" y="800" class="small">insert a reference to this y</text>
  <rect x="670" y="785" width="360" height="65" rx="8" class="bad"/>
  <text x="850" y="825" text-anchor="middle" class="mono">lambda y. y</text>
  <text x="65" y="885">The inserted reference would belong to the surrounding binder y. The freshness requirement fails.</text>
  <text x="65" y="920" class="small">Different binder identities with the same display name do not cause this failure.</text>
  <text x="65" y="950" class="small">Binder renaming could handle more cases, but our current checker does not implement it.</text>
  <text x="35" y="1015" class="small">Source: test_binding.py substitution, stop, and capture tests; test_dependent.py also checks deeper substitutions.</text>
  <text x="35" y="1040" class="small">Simplified picture: domains, contexts, and extra proof arguments are omitted, not hidden in the implementation.</text>
</svg>
