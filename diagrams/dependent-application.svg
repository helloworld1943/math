<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Dependent application: substitute an argument into the result type</title>
  <desc id="description">The identity function takes a type A and a value x of that type. Applying it to N changes both the inner domain and codomain to N. An explicit substitution relation connects source, binder, argument, and supplied result. Wrong argument types and self-typed universes are rejected.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526078"/></marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 17px; fill: #17243b; }
      .title { font-size: 27px; font-weight: bold; }
      .heading { font-size: 21px; font-weight: bold; }
      .small { font-size: 15px; fill: #465873; }
      .mono { font-family: monospace; font-size: 17px; }
      .panel { fill: white; stroke: #cbd5e1; }
      .node { fill: #e8f1ff; stroke: #4270b5; stroke-width: 1.5; }
      .rule { fill: #f0eaff; stroke: #8261b5; stroke-width: 1.5; }
      .good { fill: #e4f4ee; stroke: #31826a; }
      .bad { fill: #fff0f0; stroke: #bd4756; }
      .edge { fill: none; stroke: #526078; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1040" fill="#f3f6fb"/>
  <text x="35" y="42" class="title">2. Dependent application: the argument changes the type</text>
  <text x="35" y="72" class="small">Assumptions: N : Sort 0 and n : N. Here N is a supplied type, not a built-in natural-number type.</text>

  <rect x="25" y="95" width="1150" height="265" rx="12" class="panel"/>
  <text x="45" y="130" class="heading">PASS: one identity function, applied in two steps</text>
  <text x="45" y="165" class="mono">id = lambda A : Sort 0. lambda x : A. x</text>
  <path d="M365 235 H440" class="edge"/>
  <text x="375" y="215" class="small">apply N</text>
  <path d="M760 235 H835" class="edge"/>
  <text x="770" y="215" class="small">apply n</text>
  <rect x="45" y="190" width="320" height="105" rx="8" class="node"/>
  <text x="205" y="222" text-anchor="middle" class="mono">id</text>
  <text x="205" y="253" text-anchor="middle" class="mono">: (A : Sort 0) -&gt;</text>
  <text x="205" y="280" text-anchor="middle" class="mono">  (x : A) -&gt; A</text>
  <rect x="440" y="190" width="320" height="105" rx="8" class="node"/>
  <text x="600" y="225" text-anchor="middle" class="mono">id N</text>
  <text x="600" y="265" text-anchor="middle" class="mono">: (x : N) -&gt; N</text>
  <rect x="835" y="190" width="295" height="105" rx="8" class="node"/>
  <text x="982" y="225" text-anchor="middle" class="mono">(id N) n</text>
  <text x="982" y="265" text-anchor="middle" class="mono">: N</text>
  <text x="45" y="333">Replacing A with N changes both occurrences of A in the inner function type.</text>

  <rect x="25" y="380" width="1150" height="350" rx="12" class="panel"/>
  <text x="45" y="415" class="heading">The substitution relation connects four supplied objects</text>
  <path d="M250 495 H425" class="edge"/>
  <text x="295" y="483" class="small">source</text>
  <path d="M950 495 H775" class="edge"/>
  <text x="835" y="483" class="small">result</text>
  <path d="M515 570 V535" class="edge"/>
  <text x="455" y="560" class="small">binder</text>
  <path d="M685 570 V535" class="edge"/>
  <text x="710" y="560" class="small">argument</text>
  <rect x="45" y="455" width="205" height="80" rx="8" class="node"/>
  <text x="147" y="485" text-anchor="middle" class="small">B: original type body</text>
  <text x="147" y="517" text-anchor="middle" class="mono">(x : A) -&gt; A</text>
  <rect x="425" y="455" width="350" height="80" rx="8" class="rule"/>
  <text x="600" y="485" text-anchor="middle" class="mono">Substitute(B, A, N, R)</text>
  <text x="600" y="516" text-anchor="middle">must hold</text>
  <rect x="950" y="455" width="205" height="80" rx="8" class="node"/>
  <text x="1052" y="485" text-anchor="middle" class="small">R: proposed new type</text>
  <text x="1052" y="517" text-anchor="middle" class="mono">(x : N) -&gt; N</text>
  <rect x="440" y="570" width="150" height="55" rx="8" class="node"/>
  <text x="515" y="605" text-anchor="middle" class="mono">binder A</text>
  <rect x="610" y="570" width="150" height="55" rx="8" class="node"/>
  <text x="685" y="605" text-anchor="middle" class="mono">N</text>
  <text x="45" y="667">The result R is supplied. Smaller proof steps check its domain, body, and binding links.</text>
  <text x="45" y="700" class="small">This is a relation node with labeled argument links, not an ordinary two-object edge.</text>

  <rect x="25" y="750" width="1150" height="205" rx="12" class="panel"/>
  <text x="45" y="785" class="heading">Rejection cases tested alongside the valid example</text>
  <rect x="45" y="805" width="535" height="120" rx="8" class="bad"/>
  <text x="65" y="837" class="mono">id n</text>
  <text x="65" y="871">The first argument must have type Sort 0.</text>
  <text x="65" y="901">The supplied n has type N. The premise fails.</text>
  <rect x="600" y="805" width="535" height="120" rx="8" class="bad"/>
  <text x="620" y="837" class="mono">Sort 0 : Sort 0</text>
  <text x="620" y="871">A universe cannot have its own level here.</text>
  <text x="620" y="901">Sort 0 has type Sort 1 instead.</text>
  <text x="35" y="990" class="small">Source: test_dependent.py dependent application, wrong-argument, and universe tests.</text>
  <text x="35" y="1015" class="small">Simplified view: A and N abbreviate binder/reference objects; contexts and extra witnesses are not all drawn.</text>
</svg>
