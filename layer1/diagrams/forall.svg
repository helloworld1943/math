<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">For every x: a dependent function type in our graph</title>
  <desc id="description">Forall x of A, P x is a function-form TypeNode T. Its domain is A, its binder is x, and its codomain is an application-form TypeNode pointing to Apply(P,x). A Context owns x and its declared HasType relation. A proof is a separate Lambda checked against T. This depicts the intended Context design, not fully implemented Prop support.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#607286"/></marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 17px; fill: #203247; }
      .title { font-size: 28px; font-weight: bold; }
      .heading { font-size: 22px; font-weight: bold; }
      .small { font-size: 14px; fill: #52657b; }
      .mono { font-family: monospace; font-size: 17px; }
      .panel { fill: #fff; stroke: #cbd5df; }
      .type { fill: #eee7ff; stroke: #8a70b4; stroke-width: 1.5; }
      .expr { fill: #e7f1ff; stroke: #5883b5; stroke-width: 1.5; }
      .context { fill: #e6f1e6; stroke: #679068; stroke-width: 1.5; }
      .relation { fill: #e0f3ec; stroke: #438e78; stroke-width: 1.5; }
      .edge { fill: none; stroke: #607286; stroke-width: 1.5; marker-end: url(#arrow); }
      .label { font-size: 14px; fill: #52657b; paint-order: stroke; stroke: white; stroke-width: 5px; }
    </style>
  </defs>
  <rect width="1200" height="1120" fill="#f5f7fb"/>
  <text x="35" y="45" class="title">For every x : A, P x</text>
  <text x="35" y="78" class="mono">Lean: ∀ x : A, P x     =     (x : A) → P x</text>
  <text x="35" y="108" class="small">Given A : Type and P : A → Prop. Intended indexing: Universe(0) = Prop, Universe(1) = Type.</text>

  <rect x="25" y="130" width="1150" height="440" rx="12" class="panel"/>
  <text x="45" y="166" class="heading">1. The proposition is a TypeNode, not a Lambda or RelationAnd</text>
  <path d="M310 263 H485" class="edge"/>
  <text x="350" y="252" class="label">variable / binder</text>
  <path d="M200 235 V203 H990 V235" class="edge"/>
  <text x="560" y="199" class="label">domain</text>
  <path d="M200 305 V395" class="edge"/>
  <text x="215" y="357" class="label">codomain</text>
  <path d="M310 430 H485" class="edge"/>
  <text x="366" y="420" class="label">expression</text>
  <path d="M705 430 H880" class="edge"/>
  <text x="763" y="420" class="label">function</text>
  <path d="M595 395 V305" class="edge"/>
  <text x="610" y="354" class="label">argument</text>
  <rect x="90" y="235" width="220" height="70" rx="9" class="type"/>
  <text x="200" y="261" text-anchor="middle" class="mono">T: TypeNode</text>
  <text x="200" y="288" text-anchor="middle">form = function</text>
  <rect x="485" y="235" width="220" height="70" rx="9" class="expr"/>
  <text x="595" y="277" text-anchor="middle" class="mono">x: Variable</text>
  <rect x="880" y="235" width="220" height="70" rx="9" class="type"/>
  <text x="990" y="263" text-anchor="middle" class="mono">A: TypeNode</text>
  <text x="990" y="288" text-anchor="middle">supplied domain type</text>
  <rect x="90" y="395" width="220" height="70" rx="9" class="type"/>
  <text x="200" y="421" text-anchor="middle" class="mono">B: TypeNode</text>
  <text x="200" y="448" text-anchor="middle">form = application</text>
  <rect x="485" y="395" width="220" height="70" rx="9" class="expr"/>
  <text x="595" y="421" text-anchor="middle" class="mono">Application</text>
  <text x="595" y="448" text-anchor="middle">P x</text>
  <rect x="880" y="395" width="220" height="70" rx="9" class="expr"/>
  <text x="990" y="421" text-anchor="middle" class="mono">P: Variable</text>
  <text x="990" y="448" text-anchor="middle">declared A → Prop</text>
  <text x="45" y="513">The x in P x points to the exact binder x of T. The codomain depends on that input.</text>
  <text x="45" y="545" class="small">No loop through all values of A is required to describe or type-check this proposition.</text>

  <rect x="25" y="590" width="1150" height="270" rx="12" class="panel"/>
  <text x="45" y="626" class="heading">2. The intended Context structure owns the parameter declaration</text>
  <path d="M245 705 H365" class="edge"/>
  <text x="272" y="694" class="label">declares</text>
  <path d="M555 705 H660" class="edge"/>
  <text x="561" y="694" class="label">declared typing</text>
  <path d="M890 705 H1000" class="edge"/>
  <text x="921" y="694" class="label">second</text>
  <path d="M775 735 V762 H460 V735" class="edge"/>
  <text x="660" y="779" class="label">first argument → same x</text>
  <rect x="45" y="665" width="200" height="70" rx="9" class="context"/>
  <text x="145" y="691" text-anchor="middle" class="mono">Cx: Context</text>
  <text x="145" y="718" text-anchor="middle">owns declaration x</text>
  <rect x="365" y="665" width="190" height="70" rx="9" class="expr"/>
  <text x="460" y="707" text-anchor="middle" class="mono">x: Variable</text>
  <rect x="660" y="665" width="230" height="70" rx="9" class="relation"/>
  <text x="775" y="691" text-anchor="middle" class="mono">r: Relation</text>
  <text x="775" y="718" text-anchor="middle">HasType [x, A]</text>
  <rect x="1000" y="665" width="130" height="70" rx="9" class="type"/>
  <text x="1065" y="707" text-anchor="middle" class="mono">A</text>
  <text x="45" y="810">T uses Cx for its codomain. Cx includes the earlier Context where A and P were declared.</text>
  <text x="45" y="840" class="small">A and x are redrawn here for readability; they name the same objects as in panel 1, not new declarations.</text>

  <rect x="25" y="880" width="1150" height="175" rx="12" class="panel"/>
  <text x="45" y="916" class="heading">3. Describing the proposition is not proving it</text>
  <text x="45" y="950" class="mono">Proposition: T = (x : A) → P x</text>
  <text x="45" y="982" class="mono">Proof:       h = lambda x. evidence of P x</text>
  <text x="45" y="1014" class="mono">Check:       HasType [h, T]</text>
  <text x="35" y="1084" class="small">Conceptual diagram: Context-backed binders and Prop semantics are not fully migrated in the current Python code.</text>
  <text x="35" y="1107" class="small">Field labels explain Layer 1 roles; Layer 0 uses plain directed links. Internal markers and slot helpers are omitted.</text>
</svg>
